# NodePorts for the local k3d cluster; deploy/k3d/cluster.yaml maps them to host ports.
apiVersion: v1
kind: Service
metadata:
  name: gateway-nodeport
spec:
  type: NodePort
  selector: {app.kubernetes.io/name: gateway}
  ports:
    - {name: grpc, port: 50051, targetPort: grpc, nodePort: 30051}
    - {name: http, port: 8080, targetPort: metrics, nodePort: 30080}
---
apiVersion: v1
kind: Service
metadata:
  name: marketdata-nodeport
spec:
  type: NodePort
  selector: {app.kubernetes.io/name: marketdata}
  ports:
    - {name: http, port: 8083, targetPort: metrics, nodePort: 30083}
