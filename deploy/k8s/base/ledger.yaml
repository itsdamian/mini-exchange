# Settles trades from the event log into PostgreSQL. One replica: the log has one partition, so
# a second consumer in the group would only sit idle.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: ledger}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ledger
        app.kubernetes.io/part-of: mini-exchange
        mx.io/metrics: "true"
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      initContainers:
        # Argo CD cannot tell when Kafka, PostgreSQL or Redis accept connections (their custom
        # resources report Healthy early), and a new pod can briefly be cut off by the network
        # policy controller. Wait here instead of crash-looping once.
        - name: wait-for-dependencies
          image: busybox:1.37
          command: ["sh", "-c", "for t in mx-kafka-kafka-bootstrap:9092 mx-pg-rw:5432; do until nc -z -w 2 ${t%:*} ${t#*:}; do echo waiting for $t; sleep 2; done; done"]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources:
            requests: {memory: 8Mi, cpu: 5m}
            limits: {memory: 32Mi}
      containers:
        - name: ledger
          image: mx/ledger:dev
          imagePullPolicy: IfNotPresent
          args:
            - run
            - -kafka=mx-kafka-kafka-bootstrap:9092
            - -pg=$(PG_URI)
            - -http=:8082
          env:
            - name: PG_URI
              valueFrom: {secretKeyRef: {name: mx-pg-app, key: uri}}
          ports:
            - {name: metrics, containerPort: 8082}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources:
            requests: {memory: 48Mi, cpu: 50m}
            limits: {memory: 192Mi}
          readinessProbe:
            httpGet: {path: /readyz, port: metrics}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: metrics}
            periodSeconds: 10
            failureThreshold: 6
