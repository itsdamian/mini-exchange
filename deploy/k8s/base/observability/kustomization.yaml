apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - podmonitor.yaml
  - alerts.yaml
# Dashboard as code: Grafana's sidecar loads every ConfigMap labelled grafana_dashboard=1.
configMapGenerator:
  - name: mx-dashboard
    files:
      - mini-exchange.json=dashboard.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
