# The gateway, risk client and matching engine in one process. There must be exactly ONE: the
# engine is a single writer and two instances would both claim the sequence numbers of the log
# (a ValidatingAdmissionPolicy rejects replicas > 1). A StatefulSet replaces the pod stop-then-start,
# never side by side, and keeps the snapshot volume with it.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: gateway
spec:
  serviceName: gateway
  replicas: 1
  podManagementPolicy: OrderedReady
  selector:
    matchLabels: {app.kubernetes.io/name: gateway}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
        app.kubernetes.io/part-of: mini-exchange
        mx.io/metrics: "true"
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      terminationGracePeriodSeconds: 60     # drains the engine, flushes the log, writes a final snapshot
      initContainers:
        # Argo CD cannot tell when Kafka, PostgreSQL or Redis accept connections (their custom
        # resources report Healthy early), and a new pod can briefly be cut off by the network
        # policy controller. Wait here instead of crash-looping once.
        - name: wait-for-dependencies
          image: busybox:1.37
          command: ["sh", "-c", "for t in mx-kafka-kafka-bootstrap:9092 redis:6379; do until nc -z -w 2 ${t%:*} ${t#*:}; do echo waiting for $t; sleep 2; done; done"]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources:
            requests: {memory: 8Mi, cpu: 5m}
            limits: {memory: 32Mi}
      containers:
        - name: gateway
          image: mx/gateway:dev
          imagePullPolicy: IfNotPresent     # the image is built locally and imported into k3d
          args:
            - -kafka=mx-kafka-kafka-bootstrap:9092
            - -data-dir=/data
            - -redis=redis:6379
            # Limits high enough not to interfere with a load test; the limits themselves are
            # tested separately.
            - -risk-rate=1000000
            - -risk-burst=1000000
            - -risk-max-open=100000
          env:
            - {name: GOMAXPROCS, value: "2"}   # the engine and dispatcher spin-wait: keep it to two cores
          ports:
            - {name: grpc, containerPort: 50051}
            - {name: metrics, containerPort: 8080}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: data, mountPath: /data}
          resources:
            requests: {memory: 192Mi, cpu: 500m}
            limits: {memory: 512Mi}           # no CPU limit: throttling would show up as latency
          startupProbe:                       # recovery replays the log before the gateway serves
            httpGet: {path: /healthz, port: metrics}
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet: {path: /readyz, port: metrics}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: metrics}
            periodSeconds: 10
            failureThreshold: 6
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 1Gi}}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  selector: {app.kubernetes.io/name: gateway}
  ports:
    - {name: grpc, port: 50051, targetPort: grpc}
    - {name: metrics, port: 8080, targetPort: metrics}
