# One-off Jobs that fund accounts 1..16 identically in Redis (risk) and in the ledger, the same
# funds the load generator and the bot expect. Applied by scripts/k8s-seed.sh. They are NOT
# idempotent for Redis (risktool adds funds each time); the ledger deposit is (same -ref).
apiVersion: batch/v1
kind: Job
metadata:
  name: seed-redis
  namespace: mx
  labels: {app.kubernetes.io/part-of: mini-exchange}
spec:
  backoffLimit: 3
  template:
    metadata:
      labels: {app.kubernetes.io/name: seed-redis, app.kubernetes.io/part-of: mini-exchange}
    spec:
      restartPolicy: OnFailure
      securityContext: {runAsNonRoot: true, runAsUser: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: risktool
          image: mx/risktool:dev
          imagePullPolicy: IfNotPresent
          args: [fund, -redis=redis:6379, -from=1, -to=16, -base=1000000000, -quote=1000000000000]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: seed-ledger
  namespace: mx
  labels: {app.kubernetes.io/part-of: mini-exchange}
spec:
  backoffLimit: 3
  template:
    metadata:
      labels: {app.kubernetes.io/name: seed-ledger, app.kubernetes.io/part-of: mini-exchange}
    spec:
      restartPolicy: OnFailure
      securityContext: {runAsNonRoot: true, runAsUser: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: ledger
          image: mx/ledger:dev
          imagePullPolicy: IfNotPresent
          args: [deposit, -pg=$(PG_URI), -symbol=BTC-USD, -account=1, -to=16, -base=1000000000, -quote=1000000000000, -ref=k8s-seed]
          env:
            - name: PG_URI
              valueFrom: {secretKeyRef: {name: mx-pg-app, key: uri}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
