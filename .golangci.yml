version: "2"

linters:
  default: standard
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - misspell
    - unconvert
    - gocritic
  exclusions:
    presets:
      - std-error-handling

formatters:
  enable:
    - gofmt
    - goimports

run:
  timeout: 5m
